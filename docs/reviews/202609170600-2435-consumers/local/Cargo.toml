[workspace]
resolver = "3"
[package]
name = "identity-local-consumer"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
rss-identity-core = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-identity", rev = "62ff53cc49cdc95ce7e0b9de6be071a30a9b56fb" }
rss-identity-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-identity", rev = "62ff53cc49cdc95ce7e0b9de6be071a30a9b56fb" }
rss-identity-http-axum = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-identity", rev = "62ff53cc49cdc95ce7e0b9de6be071a30a9b56fb" }
rss-request-context = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "93ce6848b7c78753df9947bd08abfb37e5799838" }
rss-transactional-messaging = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "93ce6848b7c78753df9947bd08abfb37e5799838", default-features = false, features = ["producer"] }
rss-transactional-messaging-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "93ce6848b7c78753df9947bd08abfb37e5799838", default-features = false, features = ["integration"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid"] }
axum = "=0.8.9"
tower = { version = "0.5", features = ["util"] }
