[workspace]
resolver = "3"
[package]
name = "identity-oidc-consumer"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
rss-identity-core = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-identity", rev = "24467273bceca491dca3e1879308ac0cc07a0f8f" }
rss-identity-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-identity", rev = "24467273bceca491dca3e1879308ac0cc07a0f8f" }
rss-identity-http-axum = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-identity", rev = "24467273bceca491dca3e1879308ac0cc07a0f8f" }
rss-identity-oidc = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-identity", rev = "24467273bceca491dca3e1879308ac0cc07a0f8f" }
rss-request-context = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "93ce6848b7c78753df9947bd08abfb37e5799838" }
rss-transactional-messaging = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "93ce6848b7c78753df9947bd08abfb37e5799838", default-features = false, features = ["producer"] }
rss-transactional-messaging-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "93ce6848b7c78753df9947bd08abfb37e5799838", default-features = false, features = ["integration"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid"] }
axum = "=0.8.9"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies"] }
zeroize = "1"
[dev-dependencies]
scraper = "=0.26.0"
[features]
default = []
loopback-fixture = ["rss-identity-oidc/test-support"]
