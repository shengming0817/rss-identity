[workspace]
members = ["app/identity", "crates/identity-service-http"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.1.0"
publish = false

[workspace.dependencies]
rss-identity-core = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "c3e0fd4d1288d513a1f1c73cf57c103bdc4843b7" }
rss-identity-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "c3e0fd4d1288d513a1f1c73cf57c103bdc4843b7" }
rss-identity-oidc = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "c3e0fd4d1288d513a1f1c73cf57c103bdc4843b7" }
rss-identity-web-credentials = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "c3e0fd4d1288d513a1f1c73cf57c103bdc4843b7" }
rss-audit-core = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "c3e0fd4d1288d513a1f1c73cf57c103bdc4843b7" }
rss-audit-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "c3e0fd4d1288d513a1f1c73cf57c103bdc4843b7", features = ["messaging"] }
tokio-util = "0.7"
rss-runtime = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "c3e0fd4d1288d513a1f1c73cf57c103bdc4843b7", default-features = false }
rss-axum = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "c3e0fd4d1288d513a1f1c73cf57c103bdc4843b7", default-features = false }
rss-request-context = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "c3e0fd4d1288d513a1f1c73cf57c103bdc4843b7" }
rss-transactional-messaging = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "c3e0fd4d1288d513a1f1c73cf57c103bdc4843b7", default-features = false, features = ["producer"] }
rss-transactional-messaging-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "c3e0fd4d1288d513a1f1c73cf57c103bdc4843b7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
anyhow = "1"
zeroize = "1"
ring = "=0.17.14"
sha2 = "0.10"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
