[workspace]
members = ["crates/identity-core", "crates/identity-postgres", "crates/identity-oidc", "app/identity", "crates/identity-http-axum"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.1.0"
publish = false

[workspace.dependencies]
rss-audit-core = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-audit", rev = "5a41e3842049f9c042493d2948eab3d33a2a169f" }
rss-audit-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-audit", rev = "5a41e3842049f9c042493d2948eab3d33a2a169f", features = ["messaging"] }
rss-transactional-messaging-runtime = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "8133977d98cf49f0afb01bf66f367925c7920b45", default-features = false, features = ["producer", "consumer"] }
tokio-util = "0.7"
rss-identity-core = { path = "crates/identity-core" }
rss-runtime = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "8133977d98cf49f0afb01bf66f367925c7920b45", default-features = false }
rss-axum = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "8133977d98cf49f0afb01bf66f367925c7920b45", default-features = false }
rss-contract = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "8133977d98cf49f0afb01bf66f367925c7920b45" }
rss-request-context = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "8133977d98cf49f0afb01bf66f367925c7920b45" }
rss-transactional-messaging = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "8133977d98cf49f0afb01bf66f367925c7920b45", default-features = false, features = ["producer", "consumer"] }
rss-transactional-messaging-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "8133977d98cf49f0afb01bf66f367925c7920b45", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
anyhow = "1"
argon2 = { version = "=0.5.3", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
ring = "=0.17.14"
sha2 = "0.10"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
