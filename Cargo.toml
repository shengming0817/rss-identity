[workspace]
members = ["crates/access-core", "adapters/access-postgres", "adapters/access-oidc", "app/access-admin"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.1.0"
publish = false

[workspace.dependencies]
access-core = { path = "crates/access-core" }
rss-contract = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "bf5dd1350997d01aa834094a3347fce30247814e" }
rss-request-context = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "bf5dd1350997d01aa834094a3347fce30247814e" }
rss-transactional-messaging = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "bf5dd1350997d01aa834094a3347fce30247814e", default-features = false, features = ["producer"] }
rss-transactional-messaging-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "bf5dd1350997d01aa834094a3347fce30247814e", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
anyhow = "1"
argon2 = { version = "=0.5.3", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
sha2 = "0.10"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
