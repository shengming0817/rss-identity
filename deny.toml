[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "BSL-1.0"]
private = { ignore = true }
exceptions = [
  { name = "webauthn-rs", version = "=0.5.5", allow = ["MPL-2.0"] },
  { name = "webauthn-rs-core", version = "=0.5.5", allow = ["MPL-2.0"] },
  { name = "webauthn-rs-proto", version = "=0.5.5", allow = ["MPL-2.0"] },
  { name = "webauthn-attestation-ca", version = "=0.5.5", allow = ["MPL-2.0"] },
  { name = "base64urlsafedata", version = "=0.5.5", allow = ["MPL-2.0"] },
  { name = "webauthn-authenticator-rs", version = "=0.5.5", allow = ["MPL-2.0"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://dev.azure.com/shengming0923/rss/_git/rss", "https://dev.azure.com/shengming0923/rss/_git/rss-audit"]
# Exact revision and the resolved RSS closure are checked by check_dependencies.py.

[advisories]
ignore = []
unused-ignored-advisory = "deny"
