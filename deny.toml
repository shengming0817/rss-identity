[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "BSL-1.0"]
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://dev.azure.com/shengming0923/rss/_git/rss"]
# Exact revision and the resolved RSS closure are checked by check_dependencies.py.

[advisories]
# Owner shengming; #2357. Only access-oidc 0.1.0 -> openidconnect 4.0.1 -> rsa 0.9.10.
# Public verification only, no RSA private keys. check_dependencies.py rejects graph drift.
# Revoke on patched upstream, private-key use, or before I08 production acceptance.
ignore = ["RUSTSEC-2023-0071"]
unused-ignored-advisory = "deny"
