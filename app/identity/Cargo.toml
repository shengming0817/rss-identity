[package]
name = "rss-identity-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[[bin]]
name = "identity-admin"
path = "src/bin/admin.rs"

[[bin]]
name = "identity-server"
path = "src/bin/server.rs"
[[bin]]
name = "identity-migrate"
path = "src/bin/migrate.rs"

[dependencies]
rss-identity-web-credentials.workspace = true
ring.workspace = true
rss-audit-postgres.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
rss-runtime.workspace = true
rss-axum = { workspace = true, features = ["http1"] }
rss-identity-service-http = { path = "../../crates/identity-service-http" }
rss-identity-oidc.workspace = true
axum = { version = "=0.8.9", default-features = false, features = ["tokio", "http1", "json"] }
sha2.workspace = true
uuid.workspace = true
url = "2.5"
hex = "0.4"
http-body = "1"
http-body-util = "0.1"

rss-identity-core.workspace = true
rss-identity-postgres.workspace = true
rss-request-context.workspace = true
rss-transactional-messaging.workspace = true
rss-transactional-messaging-postgres.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
thiserror.workspace = true
zeroize.workspace = true
libc = "0.2"
sqlx = { workspace = true, features = ["uuid"] }
[dev-dependencies]
webauthn-authenticator-rs = { version = "=0.5.5", default-features = false, features = ["softpasskey"] }
tower = { version = "0.5", features = ["util"] }
anyhow.workspace = true
uuid.workspace = true
sqlx.workspace = true
rss-transactional-messaging-postgres = { workspace = true, features = ["integration"] }
[lints]
workspace = true
