[workspace]
[package]
name = "identity-consumer-proof"
version = "0.1.0"
edition = "2024"
publish = false
[[bin]]
name = "identity-federated-t3-consumer"
path = "src/t33.rs"
test = false
[dependencies]
rss-identity-client = { path = "../../crates/identity-client" }
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
anyhow = "1"
