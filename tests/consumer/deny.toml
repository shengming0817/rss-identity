[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "CDLA-Permissive-2.0", "BSL-1.0"]
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
# Standalone consumer source graph is checked by hack/check_consumer.py.

[advisories]
# #2336 test-only extension of #2357: identity-consumer-proof 0.1.0 -> openidconnect 4.0.1 -> rsa 0.9.10.
# Public verification only, no RSA private keys. hack/check_consumer.py rejects graph drift.
# Revoke on patched upstream, private-key use, or before I08 production acceptance.
ignore = ["RUSTSEC-2023-0071"]
unused-ignored-advisory = "deny"
